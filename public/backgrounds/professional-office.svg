<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
      <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#451a03"/>
        <stop offset="50%" stop-color="#78350f"/>
        <stop offset="100%" stop-color="#291205"/>
      </linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
      </linearGradient>
      <filter id="bokeh" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
    </defs>
    <rect width="1280" height="720" fill="url(#wall)"/>
    <!-- City window in background with bokeh -->
    <g filter="url(#bokeh)">
      <rect x="100" y="60" width="460" height="480" rx="8" fill="url(#glass)" stroke="#334155" stroke-width="4"/>
      <rect x="140" y="140" width="50" height="340" fill="#0369a1" opacity="0.4"/>
      <rect x="220" y="200" width="70" height="280" fill="#0284c7" opacity="0.3"/>
      <rect x="320" y="110" width="60" height="370" fill="#075985" opacity="0.4"/>
      <circle cx="280" cy="140" r="15" fill="#fef08a" opacity="0.5"/>
      <circle cx="410" cy="180" r="22" fill="#bae6fd" opacity="0.4"/>
    </g>
    <!-- Executive Bookshelf & Art -->
    <rect x="760" y="60" width="440" height="580" rx="8" fill="url(#wood)" stroke="#1c1917" stroke-width="6"/>
    <line x1="760" y1="200" x2="1200" y2="200" stroke="#1c1917" stroke-width="6"/>
    <line x1="760" y1="350" x2="1200" y2="350" stroke="#1c1917" stroke-width="6"/>
    <line x1="760" y1="490" x2="1200" y2="490" stroke="#1c1917" stroke-width="6"/>
    <!-- Books on shelves -->
    <rect x="790" y="110" width="22" height="90" fill="#dc2626" rx="2"/>
    <rect x="814" y="95" width="28" height="105" fill="#2563eb" rx="2"/>
    <rect x="844" y="120" width="18" height="80" fill="#16a34a" rx="2"/>
    <rect x="864" y="105" width="24" height="95" fill="#d97706" rx="2"/>
    <circle cx="1080" cy="150" r="32" fill="#d4d4d8" opacity="0.7"/>
    <!-- Modern Desk Edge -->
    <rect x="0" y="580" width="1280" height="140" fill="#0f172a" opacity="0.95"/>
    <line x1="0" y1="580" x2="1280" y2="580" stroke="#475569" stroke-width="3"/>
  </svg>